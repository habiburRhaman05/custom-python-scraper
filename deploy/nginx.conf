# /etc/nginx/sites-available/maisondubai-api
# ln -s /etc/nginx/sites-available/maisondubai-api /etc/nginx/sites-enabled/
# certbot --nginx -d api.example.com

upstream maisondubai_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 2m;
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Public read API
    location /api/ {
        proxy_pass         http://maisondubai_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The scrape trigger returns 202 immediately, so it does not need a long
    # timeout -- but rate-limit it: each accepted call starts a ~21 minute,
    # 2,662-page crawl. Adjust the zone in nginx.conf http{} block:
    #   limit_req_zone $binary_remote_addr zone=scrape:10m rate=1r/m;
    location = /api/admin/scrape {
        limit_req zone=scrape burst=2 nodelay;
        proxy_pass         http://maisondubai_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://maisondubai_api;
        access_log off;
    }

    location = /docs      { proxy_pass http://maisondubai_api; }
    location = /openapi.json { proxy_pass http://maisondubai_api; }
}
